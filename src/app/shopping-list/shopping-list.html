<section class="list-section">
  <h2>Items</h2>

  <ul class="shopping-list">
    @for (item of items; track $index) {
      <li class="shopping-item">
        <span>{{ item }}</span>
        <button type="button" class="delete-btn" (click)="deleteItem($index)">Supprimer</button>
      </li>
    } @empty {
      <li class="empty-message">La liste est vide.</li>
    }
  </ul>
</section>
